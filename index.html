<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wellington College Students | Home</title>

    <style>
        :root {
            --navy: #102b46;
            --navy-light: #183d5b;
            --blue: #8ed8f0;
            --background: #f3f6fa;
            --white: #ffffff;
            --text: #243447;
            --muted: #66758a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        /* Header */
        header {
            background: var(--navy);
            color: var(--white);
            text-align: center;
            padding: 45px 20px;
            border-bottom: 5px solid var(--blue);
        }

        header h1 {
            margin: 0;
            font-size: 2.4rem;
        }

        header p {
            color: var(--blue);
            margin-bottom: 0;
        }

        /* Main content */
        main {
            width: min(1000px, 92%);
            margin: 35px auto;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .intro h2 {
            color: var(--navy);
        }

        /* Website links */
        .link-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .link-card {
            display: block;
            padding: 24px;
            background: var(--white);
            border: 1px solid #dce4ed;
            border-radius: 14px;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 5px 18px rgba(16, 43, 70, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .link-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 22px rgba(16, 43, 70, 0.12);
        }

        .link-card:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 3px;
        }

        .link-card h3 {
            color: var(--navy);
            margin-top: 0;
            margin-bottom: 8px;
        }

        .link-card p {
            color: var(--muted);
            margin-bottom: 15px;
        }

        .open-link {
            color: var(--navy);
            font-weight: bold;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 25px;
            color: var(--muted);
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }

            .link-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Wellington College Students</h1>
        <p>Your central hub for student projects and tools</p>
    </header>

    <main>
        <section class="intro">
            <h2>Explore Our Websites</h2>
            <p>
                Access student tools, calculators and projects
                from one convenient place.
            </p>
        </section>

        <section class="link-grid">

            <!-- PED Calculator -->
            <a href="Calc.html" class="link-card">
                <h3>PED Calculator</h3
